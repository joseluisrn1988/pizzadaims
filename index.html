<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Daim's Pizza | Asistente de Pedidos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandDark: '#0d0d0d',
            brandCard: '#18181b',
            brandRed: '#e11d48',
            brandYellow: '#f59e0b',
            chatBot: '#27272a',
            chatUser: '#059669'
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #0d0d0d; color: #f4f4f5; font-family: system-ui, -apple-system, sans-serif; }
    .chat-scroll::-webkit-scrollbar { width: 4px; }
    .chat-scroll::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
  </style>
</head>
<body class="flex justify-center min-h-screen bg-brandDark">

  <div class="w-full max-w-md flex flex-col h-screen border-x border-zinc-800 bg-brandDark shadow-2xl relative">
    
    <!-- Top Bar -->
    <header class="bg-zinc-900/90 backdrop-blur px-4 py-3 border-b border-zinc-800 flex items-center justify-between sticky top-0 z-20">
      <div class="flex items-center space-x-3">
        <div class="relative">
          <div class="w-10 h-10 rounded-full bg-brandRed flex items-center justify-center font-black text-white text-lg shadow-lg border border-red-400/30">
            D
          </div>
          <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-zinc-900 rounded-full"></span>
        </div>
        <div>
          <h1 class="font-bold text-sm text-white flex items-center gap-1">
            DAIM'S PIZZA
            <i class="fa-solid fa-circle-check text-xs text-brandYellow"></i>
          </h1>
          <p class="text-[11px] text-zinc-400">Asistente Virtual Automático</p>
        </div>
      </div>
      <button onclick="transferirOperador('Duda general del cliente')" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-2.5 py-1.5 rounded-lg border border-zinc-700 flex items-center gap-1.5 transition">
        <i class="fa-brands fa-whatsapp text-emerald-400"></i>
        <span>Humano</span>
      </button>
    </header>

    <!-- Chat Container -->
    <main id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4 chat-scroll pb-24">
      <!-- Mensajes dinámicos aquí -->
    </main>

    <!-- Bottom Action Area -->
    <footer class="p-3 bg-zinc-900/95 border-t border-zinc-800 sticky bottom-0 z-20">
      <div id="interactiveArea" class="flex flex-col gap-2">
        <!-- Opciones interactivas según el estado -->
      </div>
      <div class="mt-2 flex gap-2">
        <input id="customInput" type="text" placeholder="Escribe una duda o pregunta..." class="flex-1 bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-brandRed" />
        <button onclick="handleCustomText()" class="bg-brandRed hover:bg-red-700 text-white px-4 py-2 rounded-xl text-sm font-semibold transition">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </div>
    </footer>

  </div>

  <script>
    const CONFIG = {
      phone: "524111184774",
      bank: {
        name: "Mercadopago",
        holder: "Perla Jazmin Alvarez Olivares",
        clabe: "722969014666918815"
      }
    };

    // Catálogo de Pizzas del menú
    const MENU_PIZZAS = [
      { id: 'jamon', name: 'Jamón', desc: 'Jamón y queso', type: 'base' },
      { id: 'tocino', name: 'Tocino', desc: 'Tocino y queso', type: 'base' },
      { id: 'salchicha', name: 'Salchicha', desc: 'Salchicha y queso', type: 'base' },
      { id: 'atun', name: 'Atún', desc: 'Atún y queso', type: 'base' },
      { id: 'chorizo', name: 'Chorizo', desc: 'Chorizo y queso', type: 'base' },
      { id: 'bistec', name: 'Bistec Adobado', desc: 'Bistec adobado y queso', type: 'base' },
      { id: 'puntas', name: 'Puntas de Bistec', desc: 'Puntas de bistec y queso', type: 'base' },
      { id: 'funghy', name: 'Funghy', desc: 'Champiñones y queso', type: 'base' },
      { id: 'hawaiana', name: 'Hawaiana', desc: 'Jamón, piña y queso', type: 'base' },
      { id: 'carnes_frias', name: 'Carnes Frías', desc: 'Salchicha, jamón, chorizo, peperoni, pimiento y queso', type: 'base' },
      { id: 'mexicana', name: 'Mexicana', desc: 'Carne molida, chiles nachos, jitomate y cebolla en rodajas', type: 'base' },
      { id: 'daims', name: "Pizza Daim's", desc: 'Salchicha, jamón, chorizo, peperoni, pimiento, tocino, piña, champiñones y queso', type: 'base' },
      { id: 'azteca', name: 'Azteca', desc: 'Frijol, cebolla, chorizo, chile jalapeño y queso', type: 'base' },
      { id: 'texana', name: 'Texana', desc: 'Salami, cebolla, chorizo, chile jalapeño y queso', type: 'base' },
      { id: 'chicken_hawaiana', name: 'Chicken Hawaiana', desc: 'Pollo, tocino, piña, queso y salsa mango habanero', type: 'base' },
      { id: '4_quesos', name: '4 Quesos', desc: 'Mozzarella, cheddar, parmesano y asadero', type: 'base' },
      { id: 'stravaganza', name: 'Stravaganza', desc: 'Peperoni, carne molida, jamón, chorizo, pimiento, cebolla, champiñones, aceitunas y queso', type: 'base' },
      { id: 'california_bbq', name: 'California BBQ', desc: 'Tocino, pollo, carne molida, queso y salsa BBQ', type: 'base' },
      { id: 'camarones', name: 'Camarones', desc: 'Camarones preparados y queso', type: 'special' }
    ];

    const SIZES = {
      base: [
        { id: 'chica', label: 'Chica (8 reb. Triangulares)', price: 130 },
        { id: 'mediana', label: 'Mediana (12 reb. Triangulares)', price: 230 },
        { id: 'grande', label: 'Grande (18 reb. Cuadradas)', price: 330 },
        { id: 'familiar', label: 'Familiar (32 reb. Cuadradas)', price: 490 },
        { id: 'jumbo', label: 'Jumbo (40 reb. Cuadradas)', price: 590 }
      ],
      special: [
        { id: 'chica', label: 'Chica (8 reb. Triangulares)', price: 140 },
        { id: 'mediana', label: 'Mediana (12 reb. Triangulares)', price: 250 },
        { id: 'grande', label: 'Grande (18 reb. Cuadradas)', price: 350 },
        { id: 'familiar', label: 'Familiar (32 reb. Cuadradas)', price: 490 },
        { id: 'jumbo', label: 'Jumbo (40 reb. Cuadradas)', price: 590 }
      ]
    };

    let cart = [];
    let orderDetails = {
      deliveryType: null,
      address: '',
      notes: '',
      paymentMethod: null,
      cashChange: ''
    };
    let currentStep = 'WELCOME';
    let tempSelectedPizza = null;

    window.addEventListener('DOMContentLoaded', () => {
      initChat();
    });

    function appendBotMsg(html) {
      const chat = document.getElementById('chatContainer');
      const div = document.createElement('div');
      div.className = 'flex items-start gap-2.5 animate-fade-in';
      div.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-brandRed flex-shrink-0 flex items-center justify-center font-bold text-xs text-white">D</div>
        <div class="bg-chatBot border border-zinc-700/60 text-zinc-100 rounded-2xl rounded-tl-sm px-4 py-3 max-w-[85%] text-sm shadow-md">
          ${html}
        </div>
      `;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function appendUserMsg(text) {
      const chat = document.getElementById('chatContainer');
      const div = document.createElement('div');
      div.className = 'flex items-end justify-end gap-2 animate-fade-in';
      div.innerHTML = `
        <div class="bg-chatUser text-white rounded-2xl rounded-tr-sm px-4 py-2.5 max-w-[85%] text-sm shadow-md">
          ${text}
        </div>
      `;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function setInteractiveUI(html) {
      document.getElementById('interactiveArea').innerHTML = html;
    }

    function initChat() {
      appendBotMsg("👋 ¡Hola! Bienvenido a <b>Daim's Pizza</b> 🍕.<br><br>Soy tu asistente virtual. ¿Qué te gustaría ordenar hoy?");
      renderMainMenuOptions();
    }

    function renderMainMenuOptions() {
      setInteractiveUI(`
        <div class="grid grid-cols-2 gap-2">
          <button onclick="startPizzaSelection()" class="bg-brandRed hover:bg-rose-700 text-white font-semibold py-2.5 px-3 rounded-xl text-xs flex items-center justify-center gap-2">
            🍕 Ver Menú de Pizzas
          </button>
          <button onclick="transferirOperador('Consulta sobre otros productos (Alitas, Bebidas, etc.)')" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 py-2.5 px-3 rounded-xl text-xs flex items-center justify-center gap-2 border border-zinc-700">
            🍗 Boneless / Bebidas
          </button>
        </div>
      `);
    }

    function startPizzaSelection() {
      appendUserMsg("Quiero ver las pizzas");
      appendBotMsg("Selecciona la pizza que deseas agregar:");

      let pizzaCards = `
        <div class="max-h-60 overflow-y-auto space-y-2 pr-1 chat-scroll">
      `;
      MENU_PIZZAS.forEach(pizza => {
        pizzaCards += `
          <button onclick="selectPizza('${pizza.id}')" class="w-full text-left bg-zinc-800/90 hover:bg-zinc-700 p-2.5 rounded-xl border border-zinc-700 flex justify-between items-center transition">
            <div>
              <div class="font-bold text-xs text-white">${pizza.name}</div>
              <div class="text-[10px] text-zinc-400 line-clamp-1">${pizza.desc}</div>
            </div>
            <i class="fa-solid fa-chevron-right text-xs text-brandYellow"></i>
          </button>
        `;
      });
      pizzaCards += `</div>`;

      setInteractiveUI(pizzaCards);
    }

    function selectPizza(pizzaId) {
      tempSelectedPizza = MENU_PIZZAS.find(p => p.id === pizzaId);
      appendUserMsg(`Elegí Pizza ${tempSelectedPizza.name}`);
      appendBotMsg(`¿En qué tamaño quieres tu <b>Pizza ${tempSelectedPizza.name}</b>?`);

      const sizeList = tempSelectedPizza.type === 'special' ? SIZES.special : SIZES.base;
      let sizeBtns = `<div class="grid grid-cols-1 gap-1.5 max-h-56 overflow-y-auto">`;
      sizeList.forEach(s => {
        sizeBtns += `
          <button onclick="confirmPizzaItem('${s.id}', ${s.price}, '${s.label}')" class="bg-zinc-800 hover:bg-zinc-700 p-2.5 rounded-xl border border-zinc-700 flex justify-between items-center text-xs text-white">
            <span>${s.label}</span>
            <span class="font-bold text-brandYellow">$${s.price}</span>
          </button>
        `;
      });
      sizeBtns += `</div>`;

      setInteractiveUI(sizeBtns);
    }

    function confirmPizzaItem(sizeId, price, sizeLabel) {
      cart.push({
        name: tempSelectedPizza.name,
        sizeId: sizeId,
        sizeLabel: sizeLabel,
        price: price
      });

      appendUserMsg(`${sizeLabel} - $${price}`);
      appendBotMsg(`✅ Agregado: <b>Pizza ${tempSelectedPizza.name}</b> (${sizeLabel}).<br>Llevas <b>$${getCartTotal()}</b> en tu orden.`);

      setInteractiveUI(`
        <div class="grid grid-cols-2 gap-2">
          <button onclick="startPizzaSelection()" class="bg-zinc-800 hover:bg-zinc-700 text-white font-medium py-2.5 px-2 rounded-xl text-xs border border-zinc-700">
            ➕ Agregar otra pizza
          </button>
          <button onclick="askDeliveryType()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-2 rounded-xl text-xs">
            🛒 Finalizar Pedido
          </button>
        </div>
      `);
    }

    function getCartTotal() {
      return cart.reduce((acc, item) => acc + item.price, 0);
    }

    function askDeliveryType() {
      appendUserMsg("Terminar mi pedido");
      appendBotMsg("¿Cómo deseas recibir tu comida?");

      setInteractiveUI(`
        <div class="grid grid-cols-2 gap-2">
          <button onclick="setDelivery('Recoger en Sucursal')" class="bg-zinc-800 hover:bg-zinc-700 text-white p-3 rounded-xl text-xs border border-zinc-700 flex flex-col items-center gap-1">
            <i class="fa-solid fa-store text-base text-brandYellow"></i>
            <span>Para Recoger</span>
          </button>
          <button onclick="setDelivery('Envío a Domicilio')" class="bg-zinc-800 hover:bg-zinc-700 text-white p-3 rounded-xl text-xs border border-zinc-700 flex flex-col items-center gap-1">
            <i class="fa-solid fa-motorcycle text-base text-brandRed"></i>
            <span>A Domicilio</span>
          </button>
        </div>
      `);
    }

    function setDelivery(type) {
      orderDetails.deliveryType = type;
      appendUserMsg(type);

      if (type === 'Envío a Domicilio') {
        appendBotMsg("Por favor escribe tu <b>dirección completa</b> (Calle, Número, Colonia y Referencias):");
        setInteractiveUI(`
          <div class="space-y-2">
            <textarea id="addressInput" rows="2" placeholder="Ej: Hidalgo #12, Col. Centro, fachada verde..." class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-2.5 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-brandRed"></textarea>
            <button onclick="saveAddress()" class="w-full bg-brandRed hover:bg-red-700 text-white py-2 rounded-xl text-xs font-semibold">
              Continuar
            </button>
          </div>
        `);
      } else {
        askPaymentMethod();
      }
    }

    function saveAddress() {
      const addr = document.getElementById('addressInput').value.trim();
      if (!addr) {
        alert("Por favor ingresa tu dirección");
        return;
      }
      orderDetails.address = addr;
      appendUserMsg(`📍 ${addr}`);
      appendBotMsg("ℹ️ <i>Nota: El costo de envío se calculará y confirmará en tu chat según tu ubicación exacta.</i>");
      askPaymentMethod();
    }

    function askPaymentMethod() {
      appendBotMsg("¿Cuál será tu forma de pago?");
      setInteractiveUI(`
        <div class="grid grid-cols-3 gap-1.5">
          <button onclick="setPayment('Efectivo')" class="bg-zinc-800 hover:bg-zinc-700 text-white p-2.5 rounded-xl text-xs border border-zinc-700 flex flex-col items-center gap-1">
            <i class="fa-solid fa-money-bill-wave text-emerald-400"></i>
            <span>Efectivo</span>
          </button>
          <button onclick="setPayment('Tarjeta')" class="bg-zinc-800 hover:bg-zinc-700 text-white p-2.5 rounded-xl text-xs border border-zinc-700 flex flex-col items-center gap-1">
            <i class="fa-solid fa-credit-card text-blue-400"></i>
            <span>Tarjeta</span>
          </button>
          <button onclick="setPayment('Transferencia')" class="bg-zinc-800 hover:bg-zinc-700 text-white p-2.5 rounded-xl text-xs border border-zinc-700 flex flex-col items-center gap-1">
            <i class="fa-solid fa-mobile-screen-button text-purple-400"></i>
            <span>Transfer</span>
          </button>
        </div>
      `);
    }

    function setPayment(method) {
      orderDetails.paymentMethod = method;
      appendUserMsg(`Pago con ${method}`);

      if (method === 'Efectivo') {
        appendBotMsg("¿Con cuánto pagarías para llevar tu cambio exacto?");
        setInteractiveUI(`
          <div class="space-y-2">
            <div class="grid grid-cols-3 gap-1">
              <button onclick="setCashChange('$200')" class="bg-zinc-800 border border-zinc-700 text-xs py-2 rounded-lg text-white">$200</button>
              <button onclick="setCashChange('$500')" class="bg-zinc-800 border border-zinc-700 text-xs py-2 rounded-lg text-white">$500</button>
              <button onclick="setCashChange('Monto Exacto')" class="bg-zinc-800 border border-zinc-700 text-xs py-2 rounded-lg text-white">Exacto</button>
            </div>
            <input id="otherCashInput" type="text" placeholder="Otro monto (Ej: $1,000)" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white" />
            <button onclick="setCashChange(document.getElementById('otherCashInput').value)" class="w-full bg-brandRed text-white py-2 rounded-xl text-xs font-semibold">Guardar</button>
          </div>
        `);
      } else if (method === 'Transferencia') {
        appendBotMsg(`
          💳 <b>Datos para Transferir:</b><br>
          • <b>Banco:</b> ${CONFIG.bank.name}<br>
          • <b>Titular:</b> ${CONFIG.bank.holder}<br>
          • <b>CLABE:</b> <code class="bg-black/50 px-1 py-0.5 rounded text-brandYellow">${CONFIG.bank.clabe}</code><br><br>
          <i>Al finalizar envíanos tu comprobante en el chat.</i>
        `);
        showOrderSummary();
      } else {
        showOrderSummary();
      }
    }

    function setCashChange(val) {
      if (!val) val = "Monto exacto";
      orderDetails.cashChange = val;
      appendUserMsg(`Pagaré con: ${val}`);
      showOrderSummary();
    }

    function showOrderSummary() {
      let total = getCartTotal();
      let summaryHtml = `
        📋 <b>RESUMEN DE TU PEDIDO:</b><br><br>
      `;

      cart.forEach(item => {
        summaryHtml += `• 1x Pizza ${item.name} (${item.sizeLabel}) - $${item.price}<br>`;
      });

      summaryHtml += `<br><b>Total en productos:</b> $${total}<br>`;
      summaryHtml += `<b>Entrega:</b> ${orderDetails.deliveryType}<br>`;
      if (orderDetails.address) {
        summaryHtml += `<b>Dirección:</b> ${orderDetails.address}<br>`;
        summaryHtml += `<b>Costo de envío:</b> A definir en WhatsApp<br>`;
      }
      summaryHtml += `<b>Forma de pago:</b> ${orderDetails.paymentMethod} ${orderDetails.cashChange ? `(${orderDetails.cashChange})` : ''}<br><br>`;
      summaryHtml += `Presiona el botón para enviar tu pedido a nuestro WhatsApp oficial:`;

      appendBotMsg(summaryHtml);

      setInteractiveUI(`
        <button onclick="sendOrderToWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl text-sm flex items-center justify-center gap-2 shadow-lg">
          <i class="fa-brands fa-whatsapp text-lg"></i>
          <span>Enviar Pedido por WhatsApp</span>
        </button>
      `);
    }

    function sendOrderToWhatsApp() {
      let total = getCartTotal();
      let text = `🍕 *NUEVO PEDIDO - DAIM'S PIZZA*\n\n`;
      text += `*DETALLE DEL PEDIDO:*\n`;
      cart.forEach(item => {
        text += `• 1x Pizza ${item.name} (${item.sizeLabel}) - $${item.price}\n`;
      });
      text += `\n*Total Productos:* $${total}\n`;
      text += `*Tipo de Entrega:* ${orderDetails.deliveryType}\n`;
      if (orderDetails.address) {
        text += `*Dirección:* ${orderDetails.address}\n`;
        text += `*Envío:* _(Pendiente de cotizar por operador)_\n`;
      }
      text += `*Forma de Pago:* ${orderDetails.paymentMethod} ${orderDetails.cashChange ? `(Paga con: ${orderDetails.cashChange})` : ''}\n\n`;
      text += `¿Me confirman de recibido y el tiempo estimado por favor?`;

      const url = `https://wa.me/${CONFIG.phone}?text=${encodeURIComponent(text)}`;
      window.open(url, '_blank');
    }

    function handleCustomText() {
      const input = document.getElementById('customInput');
      const val = input.value.trim();
      if (!val) return;

      appendUserMsg(val);
      input.value = '';

      appendBotMsg("Entendido. Para darte una respuesta personalizada con un operador de Daim's Pizza, te transferiré al chat directo de WhatsApp...");

      setTimeout(() => {
        transferirOperador(val);
      }, 1500);
    }

    function transferirOperador(consulta) {
      let msg = `Hola Daim's Pizza, tengo una consulta:\n"${consulta}"`;
      const url = `https://wa.me/${CONFIG.phone}?text=${encodeURIComponent(msg)}`;
      window.open(url, '_blank');
    }
  </script>
</body>
</html>
